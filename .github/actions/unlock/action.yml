name: Unlock encrypted files
description: Decrypts the chat prompts, test question sets and crisis lists (git-crypt) with the PBS_GIT_CRYPT_KEY secret. A missing key is NAMED STOP PBS_GIT_CRYPT_KEY_MISSING.
inputs:
  key:
    description: secrets.PBS_GIT_CRYPT_KEY (base64)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: command -v git-crypt >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt >/dev/null; }
    - shell: bash
      env:
        PBS_GIT_CRYPT_KEY: ${{ inputs.key }}
      run: bash "$GITHUB_WORKSPACE/scripts/git-crypt-unlock.sh"
