# TEMPORARY (removed after the run): the Made for you soak, compressed to ~2.5 h at the owner's ask (21 Nov 2026),
# started after chat red team run 44899789903. Red team keys under the chat-wins share cap (MFY_SHARE_USED); the
# Mac's 15-minute passes and the production backoffs kept. Workers AI on the main account, neuron ceiling 100,000.
name: mfy-soak
on: { push: { branches: [tmp/mfy-soak] } }
permissions: { contents: read }
env:
  PBS_CHAT_SOURCE: .phase-3
  PBS_RT_CF_ACCOUNT: ${{ secrets.PBS_RT_CF_ACCOUNT }}
  PBS_RT_CF_TOKEN: ${{ secrets.PBS_RT_CF_TOKEN }}
  PBS_RT_GEMINI: ${{ secrets.PBS_RT_GEMINI }}
  PBS_RT_OPENROUTER: ${{ secrets.PBS_RT_OPENROUTER }}
  PBS_RT_CF_ANALYTICS: ${{ secrets.PBS_RT_CF_ANALYTICS }}
  SOAK_DUE_HOURS: 2.5
  SOAK_RENDER_SECONDS: 60
  NEURON_CEILING: 100000
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: 80f1688821ed040a053f25251c1ca41802a2b9fa, path: .phase-3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci --prefix app --no-audit --no-fund && worker/integration/apply.sh .phase-3
      - name: Queue 12 notes (6 EN, 6 ES, both kinds, adult and teen)
        run: node worker/scripts/made-for-you-soak.mjs seed state
      - name: Neuron headroom on the main account (ceiling 100,000 today; the soak books at most one Workers AI draft, ~466)
        run: |
          used=$(node -e '
            const since = new Date().toISOString().slice(0, 10) + "T00:00:00Z";
            const q = `query { viewer { accounts(filter: {accountTag: "${process.env.PBS_RT_CF_ACCOUNT}"}) { aiInferenceAdaptiveGroups(limit: 1000, filter: {datetimeHour_geq: "${since}"}) { sum { totalNeurons } } } } }`;
            fetch("https://api.cloudflare.com/client/v4/graphql", { method: "POST", headers: { authorization: `Bearer ${process.env.PBS_RT_CF_ANALYTICS}`, "content-type": "application/json" }, body: JSON.stringify({ query: q }) })
              .then(r => r.json()).then(b => { const g = b.data?.viewer?.accounts?.[0]?.aiInferenceAdaptiveGroups;
                if (!g) { console.log("NAMED STOP NEURONS_UNREAD " + JSON.stringify(b.errors ?? b).slice(0, 200)); process.exit(1); }
                console.log(Math.round(g.reduce((s, x) => s + Number(x.sum?.totalNeurons ?? 0), 0))); })')
          echo "OUTPUT neurons before the soak: $used of $NEURON_CEILING"
          if [ "$used" -gt $(( NEURON_CEILING - 2000 )) ]; then echo "SOAK_RUNGS=gemini,openrouter" >> "$GITHUB_ENV"; echo "OUTPUT Workers AI left out: too close to the ceiling"; fi
      - name: Drain like the Mac (15-minute passes) until the promise
        run: node worker/scripts/made-for-you-soak.mjs drain state
      - name: Summary
        if: always()
        run: node worker/scripts/made-for-you-soak.mjs summary state
      - name: Neurons after
        if: always()
        run: |
          used=$(node -e '
            const since = new Date().toISOString().slice(0, 10) + "T00:00:00Z";
            const q = `query { viewer { accounts(filter: {accountTag: "${process.env.PBS_RT_CF_ACCOUNT}"}) { aiInferenceAdaptiveGroups(limit: 1000, filter: {datetimeHour_geq: "${since}"}) { sum { totalNeurons } } } } }`;
            fetch("https://api.cloudflare.com/client/v4/graphql", { method: "POST", headers: { authorization: `Bearer ${process.env.PBS_RT_CF_ANALYTICS}`, "content-type": "application/json" }, body: JSON.stringify({ query: q }) })
              .then(r => r.json()).then(b => { const g = b.data?.viewer?.accounts?.[0]?.aiInferenceAdaptiveGroups;
                if (!g) { console.log("NAMED STOP NEURONS_UNREAD " + JSON.stringify(b.errors ?? b).slice(0, 200)); process.exit(1); }
                console.log(Math.round(g.reduce((s, x) => s + Number(x.sum?.totalNeurons ?? 0), 0))); })')
          echo "OUTPUT neurons after the soak: $used of $NEURON_CEILING"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: soak, path: state/ }
  voice:
    needs: soak
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session: [es-psalm, es-imagination, en-psalm, en-imagination]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: soak, path: state }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Voice pipeline (Kokoro, ffmpeg, faster-whisper)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
          python -m pip install -q kokoro-onnx soundfile numpy faster-whisper
          mkdir -p models esp/lib esp/share
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ln -s "$(ldconfig -p | grep -m1 'libespeak-ng.so.1 ' | awk '{print $NF}')" esp/lib/libespeak-ng.dylib
          ln -s "$(dirname "$(find /usr/lib -type d -name espeak-ng-data | head -1)")/espeak-ng-data" esp/share/espeak-ng-data
      - name: Voice one made script, then transcribe it
        env: { SESSION: '${{ matrix.session }}' }
        run: |
          export PBS_KOKORO_PY="$(which python)" PBS_KOKORO_DIR="$PWD/models" PBS_ESPEAK_PREFIX="$PWD/esp" PBS_HOME="$RUNNER_TEMP/pbs"
          python - <<'PY'
          import glob, json, os, sys, time, tempfile
          from pathlib import Path
          sys.path.insert(0, 'audio')
          import made_for_you as m
          lang, kind = os.environ['SESSION'].split('-')
          jobs = [json.load(open(f)) for f in sorted(glob.glob('state/jobs/*.json'))]
          job = next((j for j in jobs if j['lang'] == lang and j['kind'] == kind), None)
          if not job:
              print(f'OUTPUT voice {lang} {kind}: no made script to voice'); sys.exit(0)
          job['lease'] = job['id']
          seen = {}
          real = m.qa.check
          def check(*a, **k):
              r = real(*a, **k); seen.update({k2: v for k2, v in r.items() if isinstance(v, (int, float, bool, str))}); return r
          m.qa.check = check
          work = Path(tempfile.mkdtemp()); t = time.time()
          out = m.render_session(m.session_item(job), work)
          wall = time.time() - t
          Path('sample').mkdir()
          Path(f"sample/{os.environ['SESSION']}-script.txt").write_text(job['reflection'])
          print(f"OUTPUT voice {lang} {kind}: {out['status']} in {wall / 60:.1f} min, {seen.get('seconds')} s at {seen.get('wpm')} wpm, qa {json.dumps(seen)}")
          if out['status'] == 'passed':
              Path(out['_local']).rename(f"sample/{os.environ['SESSION']}.m4a")
              from faster_whisper import WhisperModel
              segments, _ = WhisperModel('base', compute_type='int8').transcribe(f"sample/{os.environ['SESSION']}.m4a", language=lang)
              Path(f"sample/{os.environ['SESSION']}-heard.txt").write_text(' '.join(s.text.strip() for s in segments))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'sample-${{ matrix.session }}', path: sample/, if-no-files-found: ignore }
