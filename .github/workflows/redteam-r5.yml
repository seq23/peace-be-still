# TEMPORARY (round-5 red team for PR #52). Deleted with its branch and secrets after the run.
name: redteam-r5
on: { push: { branches: [temp/pbs-redteam-r5] } }
jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
        working-directory: worker
      - name: risk read on the live model
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PBS_RT_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PBS_RT_CF_ACCOUNT }}
        run: node --experimental-strip-types worker/scripts/risk-measure.mjs | tee risk.log || true
      - name: worker dev + red team
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PBS_RT_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PBS_RT_CF_ACCOUNT }}
          PBS_GEMINI_API_KEY: ${{ secrets.PBS_RT_GEMINI }}
          OPENROUTER_API_KEY: ${{ secrets.PBS_RT_OPENROUTER }}
          REDTEAM_ONLY: ${{ vars.REDTEAM_ONLY }}
          REDTEAM_NEURON_CEILING: "34000"  # her yes 20 Nov 2026, ~$0.04
        run: |
          bash scripts/worker-dev.sh > dev.log 2>&1 &
          for i in $(seq 1 180); do curl -s -o /dev/null http://localhost:8787/ && break; sleep 2; done
          node --experimental-strip-types worker/scripts/redteam.mjs 2>&1 | tee run.log; echo "exit ${PIPESTATUS[0]}" >> run.log
          grep -h CHAT_GATE dev.log | grep -o '"problems":"[^"]*"' | sort | uniq -c | sort -rn > gate.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: redteam-out, path: "redteam-out\nrun.log\nrisk.log\ngate.log" }
