name: Android proof (temporary)
# Temporary (removed after the review of PR pbs-play-billing): installs the Play-signed universal APK of the
# internal build, drives it on an emulator, records it, screenshots the paywall at 390 dp light and dark.
# The recording and the screens after the review code is typed are encrypted (public repo).
on:
  push:
    branches: [pbs-play-proof]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Play-signed universal APK of the internal build
        env:
          PLAY_SA: ${{ secrets.GOOGLE_PLAY_UPLOAD_SA_JSON }}
        run: node scripts/android-proof/apk.mjs "$(cat scripts/android-proof/VERSION_CODE)" app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        env:
          REVIEW_CODE: ${{ secrets.PBS_PLAY_REVIEW_CODE }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: adb install -r app.apk && python3 scripts/android-proof/drive.py out; echo "DRIVE_EXIT=$?" >> "$GITHUB_ENV"
      - name: Encrypt the secret part
        if: always()
        env:
          K: ${{ secrets.PBS_GIT_CRYPT_KEY }}
        run: |
          mkdir -p out/plain out/secret
          tar czf - -C out secret | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:K -out out/plain/secret.tar.gz.enc
          rm -rf out/secret app.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-proof, path: out/plain, retention-days: 7 }
      - name: Result
        run: test "${DRIVE_EXIT:-9}" = 0
