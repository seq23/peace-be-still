name: App checks
on:
  pull_request:
  push:
    branches: [main]
  # The cloud fill pushes manifest rows with the job token, which starts no push run; its gather job
  # dispatches this one instead, so a data commit that breaks a library-led test is seen (22 Nov 2026).
  workflow_dispatch:
permissions: { contents: read }
jobs:
  encrypted-fixtures:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt >/dev/null
      - run: node --test scripts/test/encrypted.test.mjs
  # No AI test, eval or dev script can run Workers AI on the main (billed) Cloudflare account, and no flag
  # passes the daily free stop (worker/scripts/free-ai.mjs; her answer 27 Nov 2026). No secrets, no unlock:
  # every script is refused before it loads anything else, so this runs on every PR.
  free-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --test worker/test/free-ai.unit.mjs
  # Each tap-through flow file fits the runner (at most 40 steps) and is called by the preview workflow, so a
  # PR that grows a flow fails here, not first on main (27 Nov 2026: 70 steps, main red on FLOW_INVALID).
  tap-through-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --test scripts/test/tap-through-flows.test.mjs
      # The PR app check's locked-file step (scripts/leave-out-locked.mjs) leaves out ciphertext only.
      - run: node --test scripts/test/leave-out-locked.test.mjs
  # The app's typecheck and tests on a pull request that touches the app (or the Worker files it shares), so a PR
  # is not first tested on main (#153 review). No key and no environment: the git-crypt key stays with reviewed
  # main (#140), so the encrypted app file (test/chat.render.tsx) is named and left out here and runs on main.
  # The Worker's tests are all encrypted (worker/test/*.test.ts) and stay main-only for the same reason.
  app-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 2 }
      - id: area
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(app/|worker/src/|worker/wrangler\.jsonc|content/bible/|\.github/workflows/ci\.yml)'; then echo "changed=yes" >> "$GITHUB_OUTPUT"; else echo "changed=no" >> "$GITHUB_OUTPUT"; echo "no app or shared Worker file changed: nothing to test here"; fi
      - if: steps.area.outputs.changed == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - if: steps.area.outputs.changed == 'yes'
        run: npm ci --no-audit --no-fund
      # Ciphertext cannot be typechecked or run: each locked app file is named, then left out of this checkout only.
      - if: steps.area.outputs.changed == 'yes'
        run: node ../scripts/leave-out-locked.mjs
      - if: steps.area.outputs.changed == 'yes'
        run: npm run typecheck && npm test
  # The chat prompts, test question sets and crisis lists are committed only encrypted (scripts/check-encrypted.mjs).
  encrypted:
    if: github.ref == 'refs/heads/main'
    environment: reviewed-main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt >/dev/null
      # The breakage tests first, on fresh clones (locked, no key, wrong key, plain text, copies), then the check on this tree.
      - run: node --test scripts/test/encrypted.test.mjs
        env: { PBS_GIT_CRYPT_KEY: "${{ secrets.PBS_GIT_CRYPT_KEY }}" }
      - uses: ./.github/actions/unlock
        with: { key: "${{ secrets.PBS_GIT_CRYPT_KEY }}" }
      - run: node scripts/check-encrypted.mjs
  app:
    if: github.ref == 'refs/heads/main'
    environment: reviewed-main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/unlock
        with: { key: "${{ secrets.PBS_GIT_CRYPT_KEY }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test
  worker:
    if: github.ref == 'refs/heads/main'
    environment: reviewed-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/unlock
        with: { key: "${{ secrets.PBS_GIT_CRYPT_KEY }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            app/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The Worker shares the chat contract and the Bible files with the app, so the app's types resolve too.
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: app
      # Tests run in workerd with a local D1 (Miniflare); verses come from the app's real Bible files.
      - run: npm run typecheck && npm test
  # Made for you: the lane's unit tests (the chat's real gate, ladder and providers, from this tree) and the
  # local Worker tests (the lane mounted in this Worker on a local D1, with the Mac's Python runner).
  made-for-you:
    if: github.ref == 'refs/heads/main'
    environment: reviewed-main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/unlock
        with: { key: "${{ secrets.PBS_GIT_CRYPT_KEY }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix app --no-audit --no-fund
      - run: npm ci --prefix worker --no-audit --no-fund && npm install --prefix worker --no-save --package-lock=false --no-audit --no-fund miniflare@5.20261118.0-beta
      - run: node --test worker/test/madeForYou.unit.mjs worker/test/madeForYou.local.mjs
