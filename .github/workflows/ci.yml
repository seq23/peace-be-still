name: App checks
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test
  made-for-you-worker:
    runs-on: ubuntu-latest
    env:
      PBS_CHAT_SOURCE: .phase-3
    steps:
      - uses: actions/checkout@v4
      # Standalone lane tests use the shared chat code from the integration branch.
      - uses: actions/checkout@v4
        with:
          ref: bd407cbe772b20bc49a88f24ecd347d4311d1a0e
          path: .phase-3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix app --no-audit --no-fund
      - run: npm install --prefix worker --no-save --package-lock=false --no-audit --no-fund miniflare@5.20261118.0-beta
      - run: node --test worker/test/madeForYou.unit.mjs worker/test/madeForYou.local.mjs
