name: App preview
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
  pull-requests: write
concurrency:
  # One group per branch: the push run and the pull_request run of one commit publish the
  # same preview branch, and racing each other one fails PREVIEW_HOST_FAILED (PR #240,
  # 18 Nov 2026). They queue instead of cancelling, so neither shows as a cancelled check.
  group: app-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    environment: reviewed-main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      url: ${{ steps.hosted.outputs.url }}
    defaults:
      run:
        working-directory: app
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_PBS_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run preview:web
      - uses: actions/upload-artifact@v4
        id: preview
        with:
          name: phone-web-preview
          path: app/dist
          if-no-files-found: error
      - name: Publish free phone preview
        id: hosted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/preview/host.mjs peace-be-still-app-preview
      - name: Link preview on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.hosted.outputs.url }}
        with:
          script: |
            const body = `Open the phone app preview: ${process.env.PREVIEW_URL}\n\nCommit: ${context.sha}. Free web preview; no Appetize minutes.`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      # The built app in a real browser at 390 x 844: tab labels fit, radios and the switch announce their
      # state, the onboarding guard holds (scripts/preview/check.mjs). Chrome is on the runner image.
      - name: Check the preview in a browser
        run: |
          npm i --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.62.1
          PW_DIR="$RUNNER_TEMP/pw" SHOTS_DIR="$RUNNER_TEMP/shots" node scripts/preview/check.mjs dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-shots-390x844
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn
  # THE TAP-THROUGH (ship-ready app-review.md, required for any PR that changes a screen): a robot taps
  # through this preview like a person, at 390 px light and dark, from tap-through.json. Red on a dead
  # button, a console error, an error screen, an unreachable step or a paid promise with no screen
  # behind it. Free (public repo); every write is blocked, nothing real is touched.
  # One flow file holds at most 40 steps (boss-os MAX_STEPS, one review's worth), so the journeys are split
  # across tap-through*.json, one call each, each with its own label (artifact tap-through-<label>).
  # scripts/test/tap-through-flows.test.mjs fails a PR whose flow file is over 40 steps or has no call here.
  tap-through:
    needs: preview
    uses: seq23/boss-os/.github/workflows/tap-through.yml@main
    with:
      target: ${{ needs.preview.outputs.url }}
      flow_file: tap-through.json
      label: ${{ github.run_id }}-core
  tap-through-own-night:
    needs: preview
    uses: seq23/boss-os/.github/workflows/tap-through.yml@main
    with:
      target: ${{ needs.preview.outputs.url }}
      flow_file: tap-through-own-night.json
      label: ${{ github.run_id }}-own-night
  # Korean and Chinese screens (JOB 3), each on a phone set to that language.
  tap-through-ko:
    needs: preview
    uses: seq23/boss-os/.github/workflows/tap-through.yml@main
    with:
      target: ${{ needs.preview.outputs.url }}
      flow_file: tap-through-ko.json
      label: ${{ github.run_id }}-ko
  tap-through-zh:
    needs: preview
    uses: seq23/boss-os/.github/workflows/tap-through.yml@main
    with:
      target: ${{ needs.preview.outputs.url }}
      flow_file: tap-through-zh.json
      label: ${{ github.run_id }}-zh
  tap-through-zh-hant:
    needs: preview
    uses: seq23/boss-os/.github/workflows/tap-through.yml@main
    with:
      target: ${{ needs.preview.outputs.url }}
      flow_file: tap-through-zh-hant.json
      label: ${{ github.run_id }}-zh-hant
