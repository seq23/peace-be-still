name: Site
on:
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node site/scripts/check-site.mjs && node site/scripts/check-site.mjs --self-test && node --test site/test/*.test.mjs
  # Every site PR gets a real preview: site/public published to the Cloudflare Pages project
  # peace-be-still-site-preview on a branch named for the PR (static files only; the Worker's redirects
  # and headers are not in it), then the routes named in the PR body's "Preview routes:" line (default
  # / and /es/) captured at 390 px light and dark and 1280 px by scripts/review-capture (artifact
  # review-site-pr-<n>). Korean fonts are installed so Hangul renders as it does on a phone.
  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Publish the preview
        id: pub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.76.0 pages project create peace-be-still-site-preview --production-branch=main >/dev/null 2>&1 || true
          out=$(npx --yes wrangler@4.76.0 pages deploy site/public --project-name=peace-be-still-site-preview --branch="pr-${{ github.event.pull_request.number }}" --commit-dirty=true 2>&1); echo "$out"
          url="https://pr-${{ github.event.pull_request.number }}.peace-be-still-site-preview.pages.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          # A new Pages hostname waits for its TLS certificate (first deploy only), so allow 5 minutes.
          for i in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/")" = 200 ] && exit 0; sleep 10; done
          echo "NAMED STOP: SITE_PREVIEW_UNREACHABLE - $url did not answer 200"; exit 1
      - name: Routes to capture
        id: routes
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          r=$(printf '%s' "$BODY" | sed -n 's/^Preview routes: *//p' | head -1 | tr -d '\r ')
          echo "routes=${r:-/,/es/}" >> "$GITHUB_OUTPUT"
      - name: Capture at 390 px and 1280 px
        env:
          PW_DIR: ${{ runner.temp }}/pw
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          npm i --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.62.1 >/dev/null
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium >/dev/null
          node scripts/review-capture/capture.mjs "${{ steps.pub.outputs.url }}" "${{ steps.routes.outputs.routes }}" "$RUNNER_TEMP/review"
          cat "$RUNNER_TEMP/review/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-site-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/review
          if-no-files-found: warn
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply database migrations (additive only)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: "4.76.0"
          command: d1 migrations apply peace-be-still --remote
      - name: Deploy to Cloudflare (peacebestillapp.com)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: "4.76.0"
          command: deploy
      - name: Smoke test the live site
        run: |
          sleep 10
          for u in https://peacebestillapp.com/ https://peacebestillapp.com/es/ https://peacebestillapp.com/privacy https://peacebestillapp.com/terms https://peacebestillapp.com/disclaimer https://peacebestillapp.com/es/privacidad https://peacebestillapp.com/es/terminos https://peacebestillapp.com/es/aviso https://peacebestillapp.com/sitemap.xml https://peacebestillapp.com/questions/ https://peacebestillapp.com/about https://peacebestillapp.com/support https://peacebestillapp.com/es/soporte; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u"); echo "$code $u"; [ "$code" = 200 ] || exit 1
          done
          loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://www.peacebestillapp.com/); echo "www: $loc"
          [ "$loc" = "301 https://peacebestillapp.com/" ] || exit 1
          wl=$(curl -s -o /dev/null -w '%{http_code}' https://peacebestillapp.com/api/waitlist); echo "waitlist GET: $wl"
          [ "$wl" = 405 ] || exit 1
          sv=$(curl -s https://peacebestillapp.com/api/social-visits); echo "social visits: $sv"
          echo "$sv" | grep -q '"sources":{"threads":' || { echo "NAMED STOP: SOCIAL_VISITS_UNREADABLE - /api/social-visits does not answer counts"; exit 1; }
