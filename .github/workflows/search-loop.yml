name: Search Loop

# The shared search growth engine (seq23/search-loop) on peacebestillapp.com: finds easy
# faith and sleep searches, publishes one gated page per search under /questions/
# (site/public/questions/), checks each page at 2/4/8 weeks, and uploads the weekly report
# artifact "search-loop-week". Every page ends in the store call to action (site/config/store.json). Pages land on main,
# and the push runs the Site workflow (safety check, deploy).
on:
  schedule:
    - cron: "37 10 * * *"  # 10:37 UTC: its own minute (no other caller uses :37)
  # A change to the engine's config or routing is checked on the PR (search-loop v1.12.0
  # stage validate: config + model-routing checks only, no network, no model call; peace-be-still
  # 18 Nov 2026 failed every scheduled run on a routing file nothing checked before merge).
  pull_request:
    paths:
      - search-loop.config.json
      - config/llm_routing.json
      - .github/workflows/search-loop.yml
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('search-loop-pr-{0}', github.ref) || 'search-loop' }}
  cancel-in-progress: false

jobs:
  search-loop:
    uses: seq23/search-loop/.github/workflows/search-loop.yml@56a1b11eb0262dd00dd4c379db7ff45dfebde4b6
    with:
      engine_ref: v1
      stage: ${{ github.event_name == 'pull_request' && 'validate' || inputs.stage || 'auto' }}
      # New pages join site/public/sitemap.xml; the safety check refuses a page that breaks the
      # trademark, claims or two-door rules before it is committed. Pure node, no install.
      post_build_command: node site/scripts/apply-cta.mjs && node site/scripts/build-sitemap.mjs && node site/scripts/check-site.mjs
