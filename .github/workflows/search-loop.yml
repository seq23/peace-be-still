name: Search Loop

# The shared search growth engine (seq23/search-loop) on peacebestillapp.com: finds easy
# faith and sleep searches, publishes one gated page per search under /questions/
# (site/public/questions/), checks each page at 2/4/8 weeks, and uploads the weekly report
# artifact "search-loop-week". Every page ends in the launch waitlist. Pages land on main,
# and the push runs the Site workflow (safety check, deploy).
on:
  schedule:
    - cron: "37 10 * * *"  # 10:37 UTC: its own minute (no other caller uses :37)
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: search-loop
  cancel-in-progress: false

jobs:
  search-loop:
    uses: seq23/search-loop/.github/workflows/search-loop.yml@v1
    with:
      engine_ref: v1
      stage: ${{ inputs.stage || 'auto' }}
      # New pages join site/public/sitemap.xml; the safety check refuses a page that breaks the
      # trademark, claims or two-door rules before it is committed. Pure node, no install.
      post_build_command: node site/scripts/build-sitemap.mjs && node site/scripts/check-site.mjs
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SEARCH_LOOP_CF_USAGE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SEARCH_LOOP_CF_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.SEARCH_LOOP_CF_WORKERS_AI_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.SEARCH_LOOP_GEMINI_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
