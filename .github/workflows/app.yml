name: App
on:
  pull_request:
    paths: ["app/**", "scripts/import-bibles.py", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "scripts/import-bibles.py", ".github/workflows/app.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test app/test/*.test.js
