name: Release gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test app/test/releaseGate.test.mjs
      - run: node scripts/asc-dry-run.mjs
