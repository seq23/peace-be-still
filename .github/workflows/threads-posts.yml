name: Threads Posts
# Peace Be Still's daily Threads post (@peacebestillapp) through Peace Be Still's own free Buffer
# (her yes 18 Nov 2026 to the posts, version 5). Every morning it keeps the next 4 evenings
# filled, one post each at 21:30 CT (Buffer customScheduled), from data/threads/posts.json, then
# records what it queued in data/threads/posted.json. After the bank runs out it recycles
# evergreen posts (60+ days since they ran).
# Notes, never red: THREADS_CHANNEL_NOT_CONNECTED (until she connects @peacebestillapp in Buffer
# after Meta's review; the next run retries), THREADS_BANK_LOW, THREADS_ORG_LIMIT,
# THREADS_RECYCLE_UNDER_60. Named stops (red): SECRET_MISSING_BUFFER_PEACEBESTILL_ACCESS_TOKEN, BUFFER_ORG_AMBIGUOUS,
# AMBIGUOUS_THREADS_CHANNEL, THREADS_QUEUE_PAUSED, THREADS_CONTENT_BLOCKED (a verse not word for
# word, a faith-only or banned word, wrong store wording), THREADS_NOTHING_QUEUED, and the
# Buffer client's BUFFER_TOKEN_REFUSED / BUFFER_READ_FAILED / BUFFER_POST_REFUSED.
# Every run prints `OUTPUT: queued N, scheduled ahead M, bank unposted K, recycled R`.
# Logic and proof: scripts/threads/threads_loop.mjs, scripts/threads/validate.mjs.
on:
  schedule:
    - cron: "35 8 * * *"  # daily 08:35 CT (the picture job runs at 08:45 on the same Buffer)
      timezone: America/Chicago
  pull_request:
    paths: ["scripts/threads/**", "scripts/instagram/**", "scripts/content/**", "data/threads/posts.json", "content/bible/**", "site/config/store.json", ".github/workflows/threads-posts.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: threads-posts-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/threads/validate.mjs
  post:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Queue the next 4 evenings
        timeout-minutes: 5
        env:
          BUFFER_PEACEBESTILL_ACCESS_TOKEN: ${{ secrets.BUFFER_PEACEBESTILL_ACCESS_TOKEN }}
        run: node scripts/threads/threads_loop.mjs
      - name: Record what was queued
        if: always()
        run: |
          git config user.name "peace-be-still-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/threads/posted.json
          git diff --cached --quiet && { echo "Nothing queued to record."; exit 0; }
          git commit -m "chore(threads): queued posts ledger"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "NAMED STOP: THREADS_LEDGER_PUSH_FAILED - the queued posts ledger could not be pushed to main"; exit 1
      # H5 (Boss OS, 24 Nov 2026): every post Buffer accepted (its id is in data/threads/posted.json) becomes a row in
      # Boss OS's results ledger, so Monday's growth lines can see it; a post with no row turns Monday red.
      # A replay is counted as already there. Fails by name: LEDGER_TOKEN_MISSING, POSTED_UNREAD,
      # NO_POSTS_TO_LEDGER, LEDGER_WRITE_FAILED. Prints `OUTPUT: n rows sent (w new, d already there)`.
      - name: Send what Buffer accepted to the Boss OS ledger
        if: always()
        uses: seq23/boss-os/.github/actions/ledger-rows@main
        with:
          business: peace-be-still
          file: data/threads/posted.json
          channel: threads
          token: ${{ secrets.BOSS_OPEN_LOOPS_TOKEN }}
