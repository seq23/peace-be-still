name: Content
on:
  pull_request:
    paths: ["content/**", "scripts/content/**", ".github/workflows/content.yml"]
  push:
    branches: [main]
    paths: ["content/**", "scripts/content/**", ".github/workflows/content.yml"]
  workflow_dispatch:
jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/content/library.mjs --self-test && node scripts/content/draft.mjs --self-test && node scripts/content/library.mjs check
